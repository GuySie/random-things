blueprint:
  name: OpenDisplay Weatherman 4.2" - Full
  description: >
    # OpenDisplay Weatherman Display (4.2") - Full

    A blueprint that displays a full weather dashboard on a 4.2" 400 x 300 e-paper tag: current conditions with wind, pressure, humidity, dew point, pollen and sunrise/sunset, a 4-hour forecast row, and a 5-day forecast row, with optional moon phase and pollen forecast display. Created by Claude, adapted by [Guy Sie](https://github.com/guysie) from the Weatherman blueprint originally by [Chunkysteveo](https://github.com/chunkysteveo/OpenEPaperLink-HA-Weatherman/).

    Developed against the [Solum Newton Pro 4.2" tag](https://www.solum-group.com/esl-n-iot/product-lineup/professional-esl/newton-pro)

    ## Prerequisites

    - [OpenDisplay Integration](https://github.com/OpenDisplay/Home_Assistant_Integration) (v3.0.0-beta.8 or later) must be installed and configured

    - Any weather integration (e.g., [Met.no](https://www.home-assistant.io/integrations/met)) must be set up

    - Recommended optional integrations:
      - [Moon integration](https://www.home-assistant.io/integrations/moon) for moon phase display
      - [Sun integration](https://www.home-assistant.io/integrations/sun) for accurate day/night weather icons and sunrise/sunset times
      - [Kleenex pollen integration](https://github.com/MarcoGos/kleenex_pollenradar) for current and forecast pollen readings

    - For a nicer font add [`GothamRnd-Bold.ttf`](https://github.com/chunkysteveo/OpenEPaperLink-HA-Weatherman/raw/refs/heads/main/GothamRnd-Bold.ttf)

    - Recommended: trigger this automation on a `time_pattern` schedule every 30 minutes

  domain: automation
  input:
    displays:
      name: E-Paper Display(s)
      description: What 4.2" BWRY ESLs to display the content on
      selector:
        device:
          multiple: true
          filter:
            integration: opendisplay
    automation_trigger:
      name: Trigger
      description: When to trigger the automation
      selector:
        trigger:
    optional:
      name: Optional
      icon: "mdi:cog"
      collapsed: true
      input:
        automation_conditions:
          name: Conditions
          description: Optional conditions that must be met to run the automation
          default: []
          selector:
            condition:
        weather_entity:
          name: Weather Entity
          description: Optional - will auto-select first working weather entity if not specified and also try to fall back to another working one if it is currently not working.
          default: ""
          selector:
            entity:
              filter:
                domain: weather
        current_temp_sensor:
          name: Current Temperature Sensor
          description: Optional temperature sensor to use instead of forecast temperature
          default: ""
          selector:
            entity:
              filter:
                domain: sensor
                device_class: temperature
        pollen_sensor:
          name: Pollen Forecast Sensor
          description: Optional Kleenex pollen sensor to use - if not specified all pollen rows are omitted
          default: ""
          selector:
            entity:
              filter:
                domain: sensor
        pollen_type:
          name: Pollen Specific Type
          description: Optional type of pollen to track (as listed in the Kleenex data) - if not specified will default to the total pollen count
          default: ""
          selector:
            text:
        show_temp_unit:
          name: Show units
          description: Show units for all displayed values (temperature, wind, precipitation, humidity, pressure, pollen)
          default: true
          selector:
            boolean: {}
        severe_temp_low:
          name: Low temperature threshold
          description: If this temperature or lower, indicate in accent color
          default: 3
          selector:
            number:
              unit_of_measurement: "°"
              mode: box
        severe_wind_high:
          name: High wind threshold
          description: If this windspeed or higher, indicate in accent color
          default: 50
          selector:
            number:
              unit_of_measurement: "km/h"
              mode: box
        severe_precipitation_hour:
          name: High hourly precipitation threshold
          description: If an hour's forecast precipitation is this amount or higher, indicate in accent color
          default: 5
          selector:
            number:
              unit_of_measurement: "mm"
              mode: box
        severe_pollen_high:
          name: High pollen threshold
          description: If this amount of pollen or higher, indicate in accent color
          default: 95
          selector:
            number:
              unit_of_measurement: "ppm"
              mode: box
        time_format:
          name: Time Format
          description: Choose between 12-hour (AM/PM) or 24-hour format
          default: "24h"
          selector:
            select:
              options:
                - label: "12-hour (AM/PM)"
                  value: "12h"
                - label: "24-hour"
                  value: "24h"
        start_with_today:
          name: Start Daily Forecast with Today
          description: Show today as the first day in daily forecast (default is tomorrow)
          default: false
          selector:
            boolean: {}
        weekday_format:
          name: Language
          description: Language for the interface
          default: "en"
          selector:
            select:
              options:
                - label: "English"
                  value: "en"
                - label: "German"
                  value: "de"
                - label: "Dutch"
                  value: "nl"
                - label: "French"
                  value: "fr"
                - label: "Spanish"
                  value: "es"
                - label: "Polish"
                  value: "pl"
                - label: "Croatian"
                  value: "hr"
                - label: "Swedish"
                  value: "sv"
        font_file:
          name: Font file
          description: "Path to a custom font file (default: ppb.ttf) For a better font, use `GothamRnd-Bold.ttf`"
          default: ppb.ttf
          selector:
            text: {}
        rotate:
          name: Rotation
          description: "Display rotation in degrees."
          default: "0"
          selector:
            select:
              options:
                - label: "0"
                  value: "0"
                - label: "90"
                  value: "90"
                - label: "180"
                  value: "180"
                - label: "270"
                  value: "270"

variables:
  weather_entity: !input weather_entity
  current_temp_sensor: !input current_temp_sensor
  font_file: !input font_file
  time_format: !input time_format
  weekday_lang: !input weekday_format
  start_with_today: !input start_with_today
  pollen_sensor: !input pollen_sensor
  pollen_type: !input pollen_type
  show_temp_unit: !input show_temp_unit
  forecast_entity: >-
    {% if weather_entity and states(weather_entity) not in ['unknown', 'unavailable'] %}
      {{ weather_entity }}
    {% else %}
      {{ (states | selectattr('domain','equalto','weather') | rejectattr('state','in',['unknown','unavailable']) | list | first).entity_id if states | selectattr('domain','equalto','weather') | rejectattr('state','in',['unknown','unavailable']) | list else 'unavailable' }}
    {% endif %}
  language_map: >
    {% set map = {
      "en": {
        "weekdays": ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
        "no_weather": "No working weather entity found."
      },
      "de": {
        "weekdays": ["So","Mo","Di","Mi","Do","Fr","Sa"],
        "no_weather": "Keine funktionierende Wetter-Entität gefunden."
      },
      "fr": {
        "weekdays": ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"],
        "no_weather": "Aucune entité météo fonctionnelle trouvée."
      },
      "nl": {
        "weekdays": ["Zo","Ma","Di","Wo","Do","Vr","Za"],
        "no_weather": "Geen werkende weerentiteit gevonden."
      },
      "es": {
        "weekdays": ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"],
        "no_weather": "No se encontró ninguna entidad meteorológica funcional."
      },
      "pl": {
        "weekdays": ["Nd","Pn","Wt","Śr","Cz","Pt","So"],
        "no_weather": "Nie znaleziono działającej encji pogodowej."
      },
      "hr": {
        "weekdays": ["Ned","Pon","Uto","Sri","Čet","Pet","Sub"],
        "no_weather": "Nije pronađen nijedan funkcionalan vremenski entitet."
      },
      "sv": {
        "weekdays": ["Sön","Mån","Tis","Ons","Tors","Fre","Lör"],
        "no_weather": "Ingen fungerande väderentitet hittades."
      }
    } %}
    {{ map }}

trigger: !input automation_trigger
conditions: !input automation_conditions

action:
  - choose:
      - conditions:
          - "{{ forecast_entity != 'unavailable' }}"
        sequence:
          - action: weather.get_forecasts
            target:
              entity_id: "{{ forecast_entity }}"
            data:
              type: daily
            response_variable: weather_home_daily
          - variables:
              hourly_supported: "{{ (state_attr(forecast_entity, 'supported_features') | int(0)) | bitwise_and(2) > 0 }}"
          - if:
              - "{{ hourly_supported }}"
            then:
              - action: weather.get_forecasts
                target:
                  entity_id: "{{ forecast_entity }}"
                data:
                  type: hourly
                response_variable: weather_home_hourly
          - variables:
              daily_offset: "{{ 0 if start_with_today else 1 }}"
              moon_available: >
                {{ false if states('sensor.moon_phase') == 'unknown' or states('sensor.moon_phase') == 'unavailable' else true }}
              moon_phase: >
                {% set cond_moon = states('sensor.moon_phase') %}
                {% if cond_moon == 'new_moon' %}
                moon-new
                {% elif cond_moon == 'full_moon' %}
                moon-full
                {% else %}
                {{ "moon-" + cond_moon | replace("_", "-") }}
                {%endif%}
              sun_available: >
                {{ false if states('sun.sun') == 'unknown' or states('sun.sun') == 'unavailable' else true }}

              severe_weather:
                [
                  "fog",
                  "hail",
                  "lightning",
                  "lightning-rainy",
                  "snowy",
                  "snowy-rainy",
                  "windy",
                  "windy-variant",
                  "exceptional",
                ]
              severe_temp_low: !input severe_temp_low
              severe_wind_high: !input severe_wind_high
              severe_precipitation_hour: !input severe_precipitation_hour
              severe_pollen_high: !input severe_pollen_high

              day_conditions_map:
                clear-night: "mdi:weather-night"
                cloudy: "mdi:weather-cloudy"
                fog: "mdi:weather-fog"
                hail: "mdi:weather-hail"
                lightning: "mdi:weather-lightning"
                lightning-rainy: "mdi:weather-lightning-rainy"
                partlycloudy: "mdi:weather-partly-cloudy"
                pouring: "mdi:weather-pouring"
                rainy: "mdi:weather-rainy"
                snowy: "mdi:weather-snowy"
                snowy-rainy: "mdi:weather-snowy-rainy"
                sunny: "mdi:weather-sunny"
                windy: "mdi:weather-windy"
                windy-variant: "mdi:weather-windy-variant"
                exceptional: "mdi:alert-circle-outline"

              night_conditions_map:
                clear-night: "mdi:weather-night"
                cloudy: "mdi:weather-cloudy"
                fog: "mdi:weather-fog"
                hail: "mdi:weather-hail"
                lightning: "mdi:weather-lightning"
                lightning-rainy: "mdi:weather-lightning-rainy"
                partlycloudy: "mdi:weather-night-partly-cloudy"
                pouring: "mdi:weather-pouring"
                rainy: "mdi:weather-rainy"
                snowy: "mdi:weather-snowy"
                snowy-rainy: "mdi:weather-snowy-rainy"
                sunny: "mdi:weather-night"
                windy: "mdi:weather-windy"
                windy-variant: "mdi:weather-windy-variant"
                exceptional: "mdi:alert-circle-outline"

              wind_dir_icons:
                [
                  "arrow-down",
                  "arrow-bottom-left",
                  "arrow-left",
                  "arrow-top-left",
                  "arrow-up",
                  "arrow-top-right",
                  "arrow-right",
                  "arrow-bottom-right",
                  "arrow-down",
                ]

              pollen_display: >
                {% if pollen_sensor %}{% if pollen_type %}{{ state_attr(pollen_sensor, 'details') | selectattr('name', 'match', pollen_type) | map(attribute='value') | first }}{% else %}{{ (states(pollen_sensor) | float | round) }}{% endif %}{% endif %}

              hourly_forecast: >
                {% set ns = namespace(list=[]) %}
                {% set hourly_list = weather_home_hourly[forecast_entity]['forecast'] if hourly_supported else [] %}
                {% for i in range(4) %}
                  {% if i < hourly_list | length %}
                    {% set fc = hourly_list[i] %}
                    {% set forecast_time = as_timestamp(fc.datetime) %}
                    {% set condition = fc.condition %}
                    {% if sun_available %}
                      {% set is_night = (states('sun.sun') == 'above_horizon' and forecast_time > as_timestamp(state_attr('sun.sun', 'next_setting'))) or (states('sun.sun') == 'below_horizon' and forecast_time < as_timestamp(state_attr('sun.sun', 'next_rising'))) %}
                    {% else %}
                      {% set is_night = false %}
                    {% endif %}
                    {% set wind_speed = fc.wind_speed | round %}
                    {% set precipitation = fc.precipitation %}
                    {% set ns.list = ns.list + [{
                      'time_label': (as_timestamp(fc.datetime) | timestamp_custom('%-I %p')) if time_format == '12h' else (as_timestamp(fc.datetime) | timestamp_custom('%H:00')),
                      'icon': (night_conditions_map if is_night else day_conditions_map)[condition] | default('mdi:weather-' ~ condition),
                      'is_severe': condition in severe_weather,
                      'temp': fc.temperature | round,
                      'wind_dir_icon': wind_dir_icons[(fc.wind_bearing / 45) | round],
                      'wind_speed': wind_speed,
                      'wind_is_severe': wind_speed >= severe_wind_high,
                      'precipitation': precipitation,
                      'precip_is_severe': precipitation >= severe_precipitation_hour
                    }] %}
                  {% endif %}
                {% endfor %}
                {{ ns.list }}

              daily_forecast: >
                {% set ns = namespace(list=[]) %}
                {% set daily_list = weather_home_daily[forecast_entity]['forecast'] %}
                {% set pollen_forecast_list = state_attr(pollen_sensor, 'forecast') if pollen_sensor else [] %}
                {% for i in range(5) %}
                  {% if (daily_offset + i) < daily_list | length %}
                    {% set fc = daily_list[daily_offset + i] %}
                    {% set condition = fc.condition %}
                    {% set wind_speed = fc.wind_speed | round %}
                    {% if i == 0 %}
                      {% set pollen_value = pollen_display %}
                    {% elif pollen_sensor and (i - 1) < pollen_forecast_list | length %}
                      {% set pollen_value = pollen_forecast_list[i - 1].value %}
                    {% else %}
                      {% set pollen_value = none %}
                    {% endif %}
                    {% set ns.list = ns.list + [{
                      'weekday_label': language_map[weekday_lang]['weekdays'][as_timestamp(fc.datetime) | timestamp_custom('%w') | int] | upper,
                      'icon': day_conditions_map[condition] | default('mdi:weather-' ~ condition),
                      'is_severe': condition in severe_weather,
                      'temp_hi': fc.temperature | round,
                      'temp_lo': fc.templow | round,
                      'wind_dir_icon': wind_dir_icons[(fc.wind_bearing / 45) | round],
                      'wind_speed': wind_speed,
                      'wind_is_severe': wind_speed >= severe_wind_high,
                      'pollen_value': pollen_value,
                      'pollen_is_severe': (pollen_value | float(0)) >= severe_pollen_high if pollen_value is not none else false
                    }] %}
                  {% endif %}
                {% endfor %}
                {{ ns.list }}

          - action: opendisplay.drawcustom
            target:
              device_id: !input displays
            data:
              background: white
              rotate: !input rotate
              payload: >
                [
                {% set ns_out = namespace(first=true) %}
                {% if moon_available %}
                  {% if not ns_out.first %},{% endif %}{% set ns_out.first = false %}
                  {
                    "type": "icon",
                    "value": "{{ moon_phase }}",
                    "x": 3,
                    "y": 4,
                    "size": 22,
                    "color": "black"
                  }
                {% endif %}
                {% if not ns_out.first %},{% endif %}{% set ns_out.first = false %}
                {
                  "type": "icon",
                  "value": "{% set condition = states(forecast_entity) %}{% set is_night = states('sun.sun') == 'below_horizon' %}{{ (night_conditions_map if is_night else day_conditions_map)[condition] | default('mdi:weather-' ~ condition) }}",
                  "x": 3,
                  "y": 5,
                  "size": 115,
                  "color": "{{ 'accent' if states(forecast_entity) in severe_weather else 'black' }}"
                }
                {% if not ns_out.first %},{% endif %}{% set ns_out.first = false %}
                {
                  "type": "text",
                  "value": "{% if current_temp_sensor and current_temp_sensor != '' %}{{ states(current_temp_sensor) | float | round }}{% else %}{{ state_attr(forecast_entity,'temperature') | round }}{% endif %}{% if show_temp_unit %}{{ state_attr(forecast_entity,'temperature_unit') }}{% else %}°{% endif %}",
                  "font": "{{ font_file }}",
                  "x": 62,
                  "y": 138,
                  "size": 38,
                  "color": "{{ 'black' if (state_attr(forecast_entity,'temperature') | round) > severe_temp_low else 'accent' }}",
                  "anchor": "mm"
                }
                {% if not ns_out.first %},{% endif %}{% set ns_out.first = false %}
                {
                  "type": "icon",
                  "value": "{{ wind_dir_icons[(state_attr(forecast_entity, 'wind_bearing')/45) | round] }}",
                  "x": 3,
                  "y": 155,
                  "size": 21,
                  "color": "black"
                }
                {% if not ns_out.first %},{% endif %}{% set ns_out.first = false %}
                {
                  "type": "icon",
                  "value": "mdi:gauge",
                  "x": 3,
                  "y": 175,
                  "size": 20,
                  "color": "black"
                }
                {% if not ns_out.first %},{% endif %}{% set ns_out.first = false %}
                {
                  "type": "icon",
                  "value": "mdi:water-percent",
                  "x": 3,
                  "y": 195,
                  "size": 20,
                  "color": "black"
                }
                {% if pollen_sensor %}
                  {% if not ns_out.first %},{% endif %}{% set ns_out.first = false %}
                  {
                    "type": "icon",
                    "value": "mdi:flower-pollen-outline",
                    "x": 3,
                    "y": 215,
                    "size": 20,
                    "color": "black"
                  }
                {% endif %}
                {% if not ns_out.first %},{% endif %}{% set ns_out.first = false %}
                {
                  "type": "icon",
                  "value": "mdi:thermometer-water",
                  "x": 3,
                  "y": 235,
                  "size": 20,
                  "color": "black"
                }
                {% if sun_available %}
                  {% if not ns_out.first %},{% endif %}{% set ns_out.first = false %}
                  {
                    "type": "icon",
                    "value": "mdi:weather-sunset-up",
                    "x": 3,
                    "y": 255,
                    "size": 20,
                    "color": "black"
                  }
                  {% if not ns_out.first %},{% endif %}{% set ns_out.first = false %}
                  {
                    "type": "icon",
                    "value": "mdi:weather-sunset-down",
                    "x": 3,
                    "y": 275,
                    "size": 20,
                    "color": "black"
                  }
                {% endif %}
                {% if not ns_out.first %},{% endif %}{% set ns_out.first = false %}
                {
                  "type": "text",
                  "value": "{{ state_attr(forecast_entity,'wind_speed') | round }}{% if show_temp_unit %}{{ state_attr(forecast_entity,'wind_speed_unit') }}{% endif %}",
                  "font": "{{ font_file }}",
                  "x": 118,
                  "y": 165,
                  "size": 20,
                  "color": "{{ 'black' if (state_attr(forecast_entity,'wind_speed') | round) < severe_wind_high else 'accent' }}",
                  "anchor": "rm"
                }
                {% if not ns_out.first %},{% endif %}{% set ns_out.first = false %}
                {
                  "type": "text",
                  "value": "{{ state_attr(forecast_entity,'pressure') | round }}{% if show_temp_unit %}{{ state_attr(forecast_entity,'pressure_unit') }}{% endif %}",
                  "font": "{{ font_file }}",
                  "x": 118,
                  "y": 185,
                  "size": 20,
                  "color": "black",
                  "anchor": "rm"
                }
                {% if not ns_out.first %},{% endif %}{% set ns_out.first = false %}
                {
                  "type": "text",
                  "value": "{{ state_attr(forecast_entity,'humidity') | round }}%",
                  "font": "{{ font_file }}",
                  "x": 118,
                  "y": 205,
                  "size": 20,
                  "color": "black",
                  "anchor": "rm"
                }
                {% if pollen_sensor %}
                  {% if not ns_out.first %},{% endif %}{% set ns_out.first = false %}
                  {
                    "type": "text",
                    "value": "{{ pollen_display }}{% if show_temp_unit %}ppm{% endif %}",
                    "font": "{{ font_file }}",
                    "x": 118,
                    "y": 225,
                    "size": 20,
                    "color": "{{ 'black' if (pollen_display | float(0)) < severe_pollen_high else 'accent' }}",
                    "anchor": "rm"
                  }
                {% endif %}
                {% if not ns_out.first %},{% endif %}{% set ns_out.first = false %}
                {
                  "type": "text",
                  "value": "{{ state_attr(forecast_entity,'dew_point') | round }}{% if show_temp_unit %}{{ state_attr(forecast_entity,'temperature_unit') }}{% else %}°{% endif %}",
                  "font": "{{ font_file }}",
                  "x": 118,
                  "y": 245,
                  "size": 20,
                  "color": "black",
                  "anchor": "rm"
                }
                {% if sun_available %}
                  {% if not ns_out.first %},{% endif %}{% set ns_out.first = false %}
                  {
                    "type": "text",
                    "value": "{% if time_format == '12h' %}{{ as_timestamp(state_attr('sun.sun', 'next_rising')) | timestamp_custom('%-I:%M %p') }}{% else %}{{ as_timestamp(state_attr('sun.sun', 'next_rising')) | timestamp_custom('%H:%M') }}{% endif %}",
                    "font": "{{ font_file }}",
                    "x": 118,
                    "y": 265,
                    "size": 20,
                    "color": "black",
                    "anchor": "rm"
                  }
                  {% if not ns_out.first %},{% endif %}{% set ns_out.first = false %}
                  {
                    "type": "text",
                    "value": "{% if time_format == '12h' %}{{ as_timestamp(state_attr('sun.sun', 'next_setting')) | timestamp_custom('%-I:%M %p') }}{% else %}{{ as_timestamp(state_attr('sun.sun', 'next_setting')) | timestamp_custom('%H:%M') }}{% endif %}",
                    "font": "{{ font_file }}",
                    "x": 118,
                    "y": 285,
                    "size": 20,
                    "color": "black",
                    "anchor": "rm"
                  }
                {% endif %}
                {% for h in hourly_forecast %}
                  {% set base_x = 125 + (loop.index0 * 70) %}
                  {% if not ns_out.first %},{% endif %}{% set ns_out.first = false %}
                  {
                    "type": "text",
                    "value": "{{ h.time_label }}",
                    "font": "{{ font_file }}",
                    "x": {{ base_x + 30 }},
                    "y": 25,
                    "size": 18,
                    "color": "black",
                    "anchor": "mb"
                  },
                  {
                    "type": "icon",
                    "value": "{{ h.icon }}",
                    "x": {{ base_x }},
                    "y": 25,
                    "size": 60,
                    "color": "{{ 'accent' if h.is_severe else 'black' }}"
                  },
                  {
                    "type": "text",
                    "value": "{{ h.temp }}{% if show_temp_unit %}{{ state_attr(forecast_entity,'temperature_unit') }}{% else %}°{% endif %}",
                    "font": "{{ font_file }}",
                    "x": {{ base_x + 30 }},
                    "y": 90,
                    "size": 22,
                    "color": "{{ 'black' if h.temp > severe_temp_low else 'accent' }}",
                    "anchor": "mt"
                  },
                  {
                    "type": "icon",
                    "value": "{{ h.wind_dir_icon }}",
                    "x": {{ base_x + 10 }},
                    "y": 107,
                    "size": 21,
                    "color": "{{ 'accent' if h.wind_is_severe else 'black' }}"
                  },
                  {
                    "type": "text",
                    "value": "{{ h.wind_speed }}",
                    "font": "{{ font_file }}",
                    "x": {{ base_x + 30 }},
                    "y": 117,
                    "size": 18,
                    "color": "{{ 'accent' if h.wind_is_severe else 'black' }}",
                    "anchor": "lm"
                  },
                  {
                    "type": "icon",
                    "value": "mdi:water-outline",
                    "x": {{ base_x - 1 }},
                    "y": 125,
                    "size": 20,
                    "color": "black"
                  },
                  {
                    "type": "text",
                    "value": "{{ h.precipitation }}{% if show_temp_unit %}{{ state_attr(forecast_entity, 'precipitation_unit') }}{% endif %}",
                    "font": "{{ font_file }}",
                    "x": {{ base_x + 16 }},
                    "y": 136,
                    "size": 13,
                    "color": "{{ 'accent' if h.precip_is_severe else 'black' }}",
                    "anchor": "lm"
                  }
                {% endfor %}
                {% for d in daily_forecast %}
                  {% set base_x = 125 + (loop.index0 * 56) %}
                  {% if not ns_out.first %},{% endif %}{% set ns_out.first = false %}
                  {
                    "type": "text",
                    "value": "{{ d.weekday_label }}",
                    "font": "{{ font_file }}",
                    "x": {{ base_x + 23 }},
                    "y": 178,
                    "size": 18,
                    "color": "black",
                    "anchor": "mb"
                  },
                  {
                    "type": "icon",
                    "value": "{{ d.icon }}",
                    "x": {{ base_x }},
                    "y": 180,
                    "size": 50,
                    "color": "{{ 'accent' if d.is_severe else 'black' }}"
                  },
                  {
                    "type": "text",
                    "value": "{{ d.temp_hi }}",
                    "font": "{{ font_file }}",
                    "x": {{ base_x + 22 }},
                    "y": 234,
                    "size": 13,
                    "color": "{{ 'black' if d.temp_hi > severe_temp_low else 'accent' }}",
                    "anchor": "rt"
                  },
                  {
                    "type": "text",
                    "value": "/",
                    "font": "{{ font_file }}",
                    "x": {{ base_x + 24 }},
                    "y": 237,
                    "size": 14,
                    "color": "black",
                    "anchor": "mt"
                  },
                  {
                    "type": "text",
                    "value": "{{ d.temp_lo }}",
                    "font": "{{ font_file }}",
                    "x": {{ base_x + 26 }},
                    "y": 241,
                    "size": 14,
                    "color": "{{ 'black' if d.temp_lo > severe_temp_low else 'accent' }}",
                    "anchor": "lt"
                  },
                  {
                    "type": "icon",
                    "value": "{{ d.wind_dir_icon }}",
                    "x": {{ base_x + 5 }},
                    "y": 255,
                    "size": 21,
                    "color": "{{ 'accent' if d.wind_is_severe else 'black' }}"
                  },
                  {
                    "type": "text",
                    "value": "{{ d.wind_speed }}",
                    "font": "{{ font_file }}",
                    "x": {{ base_x + 25 }},
                    "y": 265,
                    "size": 16,
                    "color": "{{ 'accent' if d.wind_is_severe else 'black' }}",
                    "anchor": "lm"
                  }
                  {% if pollen_sensor and d.pollen_value is not none %}
                    ,
                    {
                      "type": "icon",
                      "value": "mdi:flower-pollen-outline",
                      "x": {{ base_x - 1 }},
                      "y": 274,
                      "size": 20,
                      "color": "black"
                    },
                    {
                      "type": "text",
                      "value": "{{ d.pollen_value }}",
                      "font": "{{ font_file }}",
                      "x": {{ base_x + 17 }},
                      "y": 285,
                      "size": 14,
                      "color": "{{ 'accent' if d.pollen_is_severe else 'black' }}",
                      "anchor": "lm"
                    }
                  {% endif %}
                {% endfor %}
                {% if not ns_out.first %},{% endif %}{% set ns_out.first = false %}
                {
                  "type": "line",
                  "x_start": 123,
                  "x_end": 123,
                  "y_start": 10,
                  "y_end": 290,
                  "fill": "black",
                  "width": 1
                },
                {
                  "type": "line",
                  "x_start": 135,
                  "x_end": 390,
                  "y_start": 150,
                  "y_end": 150,
                  "fill": "black",
                  "width": 1
                }
                ]
    default:
      - action: opendisplay.drawcustom
        target:
          device_id: !input displays
        data:
          background: white
          rotate: !input rotate
          payload: >
            [
              {
              "type": "text",
              "value": "{{ language_map[weekday_lang]['no_weather']}}",
              "font": "{{ font_file }}",
              "x": "50%",
              "y": "50%",
              "size": 24,
              "color": "red",
              "anchor": "mm",
              "max_width": 340
              }
            ]

mode: single
