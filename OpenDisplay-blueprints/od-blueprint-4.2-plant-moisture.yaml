blueprint:
  name: OpenDisplay Plant Moisture 4.2"
  description: >
    # OpenDisplay Plant Moisture Dashboard (4.2")

    A blueprint that displays soil moisture readings for up to 22 plants, laid out as two columns of 11 rows each, on a 4.2" 400 x 300 pixel e-paper tag. Each row's sensor and label are fully configurable, and plants are packed in order (no gaps) so leaving slots empty just shortens the list. A configurable threshold highlights dry plants in accent color. Created by Claude for [Guy Sie](https://github.com/guysie).

    Developed against the [Solum Newton Pro 4.2" tag](https://www.solum-group.com/esl-n-iot/product-lineup/professional-esl/newton-pro)

    ## Prerequisites

    - [OpenDisplay Integration](https://github.com/OpenDisplay/Home_Assistant_Integration) (v3.0.0-beta.8 or later) must be installed and configured

    - One or more soil moisture sensors (e.g. from a plant monitor integration) must be set up

    - For a nicer font add [`GothamRnd-Bold.ttf`](https://github.com/chunkysteveo/OpenEPaperLink-HA-Weatherman/raw/refs/heads/main/GothamRnd-Bold.ttf)

  domain: automation
  input:
    displays:
      name: E-Paper Display(s)
      description: What 4.2" BWRY ESLs to display the content on
      selector:
        device:
          multiple: true
          filter:
            integration: opendisplay
    automation_trigger:
      name: Trigger
      description: When to trigger the automation
      selector:
        trigger:
    optional:
      name: Optional
      icon: "mdi:cog"
      collapsed: true
      input:
        automation_conditions:
          name: Conditions
          description: Optional conditions that must be met to run the automation
          default: []
          selector:
            condition:
        plant_1_sensor:
          name: "Plant 1 - Sensor"
          description: Soil moisture sensor for plant 1. Leave blank to disable this row.
          default: ""
          selector:
            entity:
              filter:
                domain: sensor
        plant_1_label:
          name: "Plant 1 - Label"
          description: Optional label override. Leave blank to derive it from the sensor's name.
          default: ""
          selector:
            text: {}
        plant_2_sensor:
          name: "Plant 2 - Sensor"
          description: Soil moisture sensor for plant 2. Leave blank to disable this row.
          default: ""
          selector:
            entity:
              filter:
                domain: sensor
        plant_2_label:
          name: "Plant 2 - Label"
          description: Optional label override. Leave blank to derive it from the sensor's name.
          default: ""
          selector:
            text: {}
        plant_3_sensor:
          name: "Plant 3 - Sensor"
          description: Soil moisture sensor for plant 3. Leave blank to disable this row.
          default: ""
          selector:
            entity:
              filter:
                domain: sensor
        plant_3_label:
          name: "Plant 3 - Label"
          description: Optional label override. Leave blank to derive it from the sensor's name.
          default: ""
          selector:
            text: {}
        plant_4_sensor:
